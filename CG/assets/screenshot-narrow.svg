<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="phone-shadow" x="-50" y="-50" width="500" height="900" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="20" stdDeviation="20" flood-opacity="0.2"/>
        </filter>
        <pattern id="hex-bg" x="0" y="0" width="20" height="34" patternUnits="userSpaceOnUse">
            <path d="M10 0L20 5V15L10 20L0 15V5L10 0Z" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        </pattern>
         <linearGradient id="card-grad" x1="0" y1="0" x2="300" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="white"/>
            <stop offset="1" stop-color="#F8FAFC"/>
        </linearGradient>
    </defs>

    <!-- Background Context -->
    <rect width="400" height="800" fill="#F1F5F9"/>
    
    <!-- Phone Frame -->
    <g filter="url(#phone-shadow)">
        <rect x="25" y="25" width="350" height="750" rx="45" fill="#1E293B"/> <!-- Bezel -->
        <rect x="35" y="35" width="330" height="730" rx="35" fill="#F8FAFC"/> <!-- Screen bg -->
        <rect x="35" y="35" width="330" height="730" rx="35" fill="url(#hex-bg)" fill-opacity="0.5"/>
        
        <!-- Camera Island / Dynamic Island -->
        <rect x="135" y="45" width="130" height="30" rx="15" fill="#000000"/>
    </g>

    <!-- UI Content -->
    <g transform="translate(35, 35)">
        <!-- Status Bar -->
        <text x="35" y="30" font-family="sans-serif" font-weight="600" font-size="12" fill="#1E293B">9:41</text>
        <path d="M280 20H300V30H280V20Z" fill="#1E293B"/> <!-- Wifi -->
        
        <!-- App Header with Profile -->
        <g transform="translate(20, 80)">
             <text x="0" y="10" font-family="sans-serif" font-weight="900" font-size="28" fill="#1E293B">Hello, Amey</text>
             <text x="0" y="30" font-family="sans-serif" font-size="14" fill="#64748B">Welcome to CG Lab</text>
             <circle cx="280" cy="10" r="20" fill="#E2E8F0"/>
             <text x="280" y="15" font-family="serif" font-weight="bold" font-size="16" text-anchor="middle" fill="#7C3AED">A</text>
        </g>
        
        <!-- Dashboard Stats Cards (Carousel) -->
        <g transform="translate(20, 140)">
             <!-- Card 1 -->
             <rect width="140" height="100" rx="16" fill="#7C3AED"/>
             <path d="M100 0C100 0 140 20 140 100V0H100Z" fill="#ffffff" fill-opacity="0.1"/>
             <text x="15" y="30" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Completed</text>
             <text x="15" y="60" font-family="sans-serif" font-weight="bold" font-size="24" fill="white">100%</text>
             <text x="15" y="80" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">All tasks done</text>

             <!-- Card 2 -->
             <rect x="155" width="140" height="100" rx="16" fill="white" stroke="#E2E8F0"/>
             <text x="170" y="30" font-family="sans-serif" font-size="12" fill="#64748B">Grade</text>
             <text x="170" y="60" font-family="sans-serif" font-weight="bold" font-size="24" fill="#10B981">A+</text>
             <text x="170" y="80" font-family="sans-serif" font-size="10" fill="#94A3B8">Excellent</text>
        </g>

        <!-- Experiments List Header -->
        <text x="20" y="280" font-family="sans-serif" font-weight="bold" font-size="18" fill="#1E293B">Recent Experiments</text>
        <text x="280" y="280" font-family="sans-serif" font-size="12" fill="#7C3AED">View All</text>

        <!-- Experiments List -->
        <g transform="translate(20, 300)">
            <!-- Item 1 -->
            <rect width="290" height="80" rx="16" fill="white" stroke="#E2E8F0"/>
            <rect x="15" y="15" width="50" height="50" rx="12" fill="#F3E8FF"/>
            <path d="M40 40L25 25M40 40L55 25" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
            <text x="80" y="35" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1E293B">Line Rasterization</text>
            <text x="80" y="55" font-family="sans-serif" font-size="12" fill="#64748B">Bresenham's algorithm</text>
            <circle cx="260" cy="40" r="12" fill="#F1F5F9"/>
            <path d="M258 36L262 40L258 44" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Item 2 -->
            <g transform="translate(0, 95)">
                <rect width="290" height="80" rx="16" fill="white" stroke="#E2E8F0"/>
                <rect x="15" y="15" width="50" height="50" rx="12" fill="#FDF2F8"/>
                <circle cx="40" cy="40" r="10" stroke="#DB2777" stroke-width="2"/>
                <text x="80" y="35" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1E293B">Midpoint Circle</text>
                <text x="80" y="55" font-family="sans-serif" font-size="12" fill="#64748B">Symmetric generation</text>
                <circle cx="260" cy="40" r="12" fill="#F1F5F9"/>
                 <path d="M258 36L262 40L258 44" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </g>
        
        <!-- Floating Navigation Bar -->
        <g transform="translate(20, 660)">
             <rect width="290" height="60" rx="30" fill="#1E293B" filter="url(#phone-shadow)"/>
             <circle cx="72" cy="30" r="4" fill="#7C3AED"/>
             <circle cx="72" cy="30" r="20" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.3"/>
             <circle cx="145" cy="30" r="4" fill="#64748B"/>
             <circle cx="218" cy="30" r="4" fill="#64748B"/>
        </g>
    </g>

</svg>
